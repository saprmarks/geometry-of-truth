# Replace weights_directory with either:
# * the absolute path to where you store your weights, or
# * a Hugging Face repo id (Llama-2 repos are gated; accept the license and `huggingface-cli login`)
[llama-13b]
weights_directory = huggyllama/llama-13b
name = LLaMA-13B
probe_layer = 13
intervene_layer = 7
noperiod = False

[llama-2-13b]
weights_directory = meta-llama/Llama-2-13b-hf
name = LLaMA-2-13B
probe_layer = 14
intervene_layer = 8
noperiod = False

[llama-2-70b]
weights_directory = meta-llama/Llama-2-70b-hf
name = LLaMA-2-70B
intervene_layer = 8
probe_layer = 27
noperiod = False

[llama-2-7b]
weights_directory = meta-llama/Llama-2-7b-hf
